[project]
name = "recheck"
version = "0.1.0"
description = "Recheck API, rules, scheduled checks and simulator"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]

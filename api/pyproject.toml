[project]
name = "recheck"
version = "0.1.0"
description = "Recheck API, rules, scheduled checks and simulator"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14,<3",
    "pyjwt[crypto]>=2.10",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: uses the real database in RECHECK_DATABASE_URL (skip with -m 'not live')"]

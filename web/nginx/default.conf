# Serves the built React app and proxies the API, so the browser sees one origin
# (the HttpOnly session cookies and relative /api paths depend on that).

# Keep the scheme Caddy saw (https in production); fall back to ours locally.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Ready for a future live-updates transport (WebSocket upgrade).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the api container on each request through Docker's DNS, so nginx
    # keeps working after the api container restarts with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Don't hold back streamed responses (server-sent events).
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 1m;
    }

    # FastAPI's interactive docs, handy during judging.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Vite puts content-hashed files here.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The web app manifest, with its registered type. The service worker
    # (/sw.js) uses the default below: no-cache, so an update reaches phones.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Client-side routes (/v/:token, /staff/...) fall back to the app shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
